<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: sans-serif;
            padding: 15px;
            color: #333;
            background-color: #f9f9f9;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 5px;
            color: #1a1a1a;
        }

        .section-title {
            font-size: 11px;
            font-weight: bold;
            color: #757575;
            margin-top: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 3px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            border: 1px solid #ccc;
            background: white;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
            text-align: center;
        }

        button:hover {
            background: #f0f7ff;
            border-color: #0d99ff;
        }

        .btn-layout {
            border-left: 4px solid #ff9800;
        }

        .btn-role {
            border-left: 4px solid #9c27b0;
        }

        .btn-main {
            background: #0d99ff;
            color: white;
            border: none;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-main:hover {
            background: #007be5;
        }

        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <h2>Manual Tagging System</h2>

    <div class="section-title">LAYOUT (ESTRUTURA)</div>
    <div class="grid">
        <button class="btn-layout" onclick="applyTag('page-wrapper')">Página (Wrapper)</button>
        <button class="btn-layout" onclick="applyTag('container')">Seção (1140px Boxed)</button>
        <button class="btn-layout" onclick="applyTag('container-full')">Container Filho (100% Full)</button>
    </div>

    <div class="section-title">WIDGETS DE CONTEÚDO</div>
    <div class="grid">
        <button onclick="applyTag('heading')">Título (Heading)</button>
        <button onclick="applyTag('image')">Imagem</button>
        <button onclick="applyTag('image-background')">Fundo (Ignorar)</button>
        <button onclick="applyTag('image-box')">Caixa de Imagem</button>
        <button onclick="applyTag('icon-box')">Caixa de Ícone</button>
        <button onclick="applyTag('icon-list')">Lista de Ícone</button>
        <button onclick="applyTag('text-editor')">Editor de Texto</button>
        <button onclick="applyTag('button')">Botão (CTA)</button>
    </div>

    <div class="section-title">DINÂMICOS</div>
    <div class="grid">
        <button onclick="applyTag('image-carousel')">Carrossel Imagem</button>
        <button onclick="applyTag('container-carousel')">Carrossel Container</button>
    </div>

    <div class="section-title">SUB-ELEMENTOS (INNER ROLES)</div>
    <div class="grid">
        <button class="btn-role" onclick="applyRole('title_text')">Marcar Título</button>
        <button class="btn-role" onclick="applyRole('description_text')">Marcar Descrição</button>
        <button class="btn-role" onclick="applyRole('icon')">Marcar Ícone</button>
        <button class="btn-role" onclick="applyRole('image')">Marcar Imagem</button>
    </div>

    <div class="section-title">VARIÁVEIS GLOBAIS (DE-PARA)</div>
    <div style="margin-top: 8px;">
        <label style="font-size: 10px; font-weight: bold;">Cores (Figma.Style:Elementor.Global)</label>
        <textarea id="color-map" placeholder="Brand Primary:primary&#10;Brand Secondary:secondary" style="height: 50px;"></textarea>
    </div>
    <div style="margin-top: 8px;">
        <label style="font-size: 10px; font-weight: bold;">Tipografia (Figma.Style:Elementor.Global)</label>
        <textarea id="typo-map" placeholder="Heading 1:primary" style="height: 50px;"></textarea>
    </div>

    <button id="generate" class="btn-main">GERAR E BAIXAR JSON</button>
    
    <div style="position: relative; margin-top: 10px;">
        <button id="copy-btn" style="position: absolute; right: 5px; top: 5px; background: #eee; border: 1px solid #ccc; padding: 4px 8px; font-size: 10px; cursor: pointer; border-radius: 3px; z-index: 10;">Copiar JSON</button>
        <textarea id="output" placeholder="O código JSON aparecerá aqui..." style="margin-top: 0; padding-top: 30px;"></textarea>
    </div>

    <script>
        function applyTag(tag) {
            parent.postMessage({ pluginMessage: { type: 'apply-tag', tag: tag } }, '*');
        }

        function applyRole(role) {
            parent.postMessage({ pluginMessage: { type: 'apply-role', role: role } }, '*');
        }

        function parseMap(text) {
            const map = {};
            if (!text) return map;
            text.split('\n').forEach(line => {
                const parts = line.split(':');
                if (parts.length === 2) {
                    map[parts[0].trim()] = parts[1].trim();
                }
            });
            return map;
        }

        document.getElementById('generate').onclick = () => {
            const colorMap = parseMap(document.getElementById('color-map').value);
            const typoMap = parseMap(document.getElementById('typo-map').value);
            parent.postMessage({ pluginMessage: { type: 'export-json', colorMap, typoMap } }, '*');
        }

        document.getElementById('copy-btn').onclick = () => {
            const textarea = document.getElementById('output');
            textarea.select();
            document.execCommand('copy');
            const btn = document.getElementById('copy-btn');
            btn.innerText = 'Copiado!';
            setTimeout(() => btn.innerText = 'Copiar JSON', 2000);
        }

        onmessage = (event) => {
            const msg = event.data.pluginMessage;
            if (msg.type === 'json-generated') {
                const textarea = document.getElementById('output');
                textarea.value = msg.data;

                // Lógica de Download Automático (Fase 03)
                const blob = new Blob([msg.data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `elementor-template-${Date.now()}.json`;
                link.click();
                URL.revokeObjectURL(url);
            }
        }
    </script>
</body>

</html>
